name: Deploy Documentation

# Builds the Starlight docs site (generated from docs/ by docs-kit, at the
# version docs-site/package.json pins) and the Doxygen C++ API reference, and
# publishes them to GitHub Pages at https://branes-ai.github.io/cortex/. The
# steps are docs-kit's shared deploy workflow; this file keeps the triggers.
#
# One-time setup (repo admin, cannot be automated here): Settings → Pages →
# Build and deployment → Source = "GitHub Actions". After that, every push
# to main touching docs/, docs-site/, the public headers (API reference), the
# sources of the benchmark gates the site shows (gen-benchmarks.mjs), or this
# workflow redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'math/include/**'
      - 'sdk/include/**'
      - 'cv/include/**'
      # Benchmark-gate sources the docs are pinned to (gen-benchmarks.mjs):
      - 'tests/sdk/vio_euroc.cpp'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least privilege globally; the deploy job opts into the Pages write scopes.
permissions:
  contents: read

jobs:
  pages:
    uses: branes-ai/docs-kit/.github/workflows/pages.yml@baa140407d9403606b61148c8a8c7b9f95e736eb  # v0.3.0
    # The deploy job inside needs the Pages write scopes.
    permissions:
      contents: read
      pages: write
      id-token: write
