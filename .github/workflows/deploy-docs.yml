name: Deploy Documentation

# Builds the Starlight docs site + the Doxygen C++ API reference and
# publishes them to GitHub Pages at https://branes-ai.github.io/cortex/.
#
# One-time setup (repo admin, cannot be automated here): Settings → Pages →
# Build and deployment → Source = "GitHub Actions". After that, every push
# to main touching docs-site/ (or this workflow) redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'math/include/**'
      - 'sdk/include/**'
      - 'cv/include/**'
      # Benchmark-gate sources the docs are pinned to (gen-benchmarks.mjs):
      - 'tests/sdk/vio_euroc.cpp'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least privilege globally; the deploy job opts into the Pages write scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install Doxygen
        # Hardened against a stalled Ubuntu mirror (2026-10-07: azure.archive.ubuntu.com
        # failed on some runners and the archive.ubuntu.com fallback hung apt for
        # 90+ min). Per-request timeouts and retries, a hard cap per attempt, and
        # up to 3 attempts, all inside a step timeout.
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            sudo dpkg --configure -a || true
            if timeout 180 sudo apt-get $APT_OPTS update && \
               timeout 300 sudo apt-get $APT_OPTS install -y --no-install-recommends doxygen; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          exit 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Generate C++ API reference (Doxygen)
        working-directory: docs-site
        run: npm run api

      - name: Build site (Astro)
        working-directory: docs-site
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/dist

  deploy:
    # Only the deploy job needs the Pages write scopes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
