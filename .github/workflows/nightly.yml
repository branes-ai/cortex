name: Cortex nightly

# The [nightly] tests: characterizations that pin a known defect, such as the
# body-frame MSCKF's yaw observability leak (#212). They assert that the defect
# is still there, so a fix fails them by design, and they don't gate pull
# requests. They run here every night, under both compilers, and on demand.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CMAKE_C_COMPILER_LAUNCHER: "sccache"
  CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

jobs:
  nightly:
    name: Nightly tests (SITL - x86, ${{ matrix.label }} Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: sitl-release,       label: GCC }
          - { preset: sitl-clang-release, label: Clang }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master @ 2026-05-23
        with:
          toolchain: 1.83.0
      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb  # v4.4.2
        with:
          cmakeVersion: "~4.0.0"
      - name: Run sccache-action
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run the [nightly] C++ tests
        run: ctest --preset ${{ matrix.preset }} --label-regex nightly
