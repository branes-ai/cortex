<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">S1 visual-inertial alignment</title>
  <desc id="desc">Dynamic initialization matches two views of the same keyframe trajectory. Structure from Motion gives the keyframe positions p_i with the right shape but no scale, in an arbitrary vision frame. IMU preintegration gives the metric displacements and velocity changes between keyframes, Delta p and Delta v, which still contain gravity. Between consecutive keyframes, s (p_j minus p_i) = v_i Delta t minus one half g Delta t squared plus R_i Delta p, and v_j minus v_i = minus g Delta t plus R_i Delta v. A linear least-squares solve recovers the per-keyframe velocities, the gravity vector and the scale s: a rough pass with gravity free, then refinement with gravity held to 9.81 metres per second squared. The window is declined when the resolved motion, s times the largest keyframe displacement, is below 5 centimetres, because the scale is then unobservable. Finally the result is rotated so that gravity points along minus z.</desc>

  <style>
    /* SVGs embedded via &lt;img&gt; cannot inherit the page's text colour, so
       currentColor would fall back to black and vanish on a dark site theme.
       Set the colour (which every currentColor fill/stroke inherits) and a
       self-contained background here, switched by the viewer's colour scheme. */
    svg { color: #1a1a1a; }
    .theme-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6e6e9; }
      .theme-bg { fill: #1c1e26; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect class="theme-bg" x="0" y="0" width="820" height="560"/>

  <!-- ===== Title ===== -->
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">S1 dynamic initialization — visual-inertial alignment</text>
  <text x="410" y="50" text-anchor="middle" font-size="11.5" fill="currentColor" opacity="0.7">the same keyframe window seen twice: vision has the shape, the IMU has the metres</text>

  <!-- ===== Left panel: vision (SfM) ===== -->
  <rect x="30" y="70" width="300" height="240" rx="10" fill="#8b5cf6" fill-opacity="0.06" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="180" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8b5cf6">Vision: Structure from Motion</text>
  <text x="180" y="111" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">keyframe poses (R_i, p_i): right shape, no scale</text>

  <path d="M 100 230 Q 112 214 130 210 Q 150 202 166 203 Q 186 204 202 212 Q 218 222 229 236" stroke="#8b5cf6" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
  <g fill="#8b5cf6">
    <circle cx="100" cy="230" r="4"/>
    <circle cx="130" cy="210" r="4"/>
    <circle cx="166" cy="203" r="4"/>
    <circle cx="202" cy="212" r="4"/>
    <circle cx="229" cy="236" r="4"/>
  </g>
  <text x="96" y="250" text-anchor="middle" font-size="11" fill="currentColor">p₀</text>
  <text x="128" y="198" text-anchor="middle" font-size="11" fill="currentColor">p₁</text>
  <text x="166" y="192" text-anchor="middle" font-size="11" fill="currentColor">p₂</text>
  <text x="204" y="200" text-anchor="middle" font-size="11" fill="currentColor">p₃</text>
  <text x="236" y="255" text-anchor="middle" font-size="11" fill="currentColor">p₄</text>

  <!-- arbitrary vision frame -->
  <g stroke="currentColor" stroke-width="1.3" fill="none" opacity="0.65">
    <line x1="60" y1="290" x2="60" y2="262" marker-end="url(#arrow)"/>
    <line x1="60" y1="290" x2="88" y2="296" marker-end="url(#arrow)"/>
  </g>
  <text x="96" y="294" font-size="10.5" fill="currentColor" opacity="0.75">arbitrary vision frame:</text>
  <text x="96" y="306" font-size="10.5" fill="currentColor" opacity="0.75">gravity direction unknown</text>

  <!-- ===== Scale arrow ===== -->
  <line x1="340" y1="190" x2="478" y2="190" stroke="currentColor" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="409" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">× s</text>
  <text x="409" y="210" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">metric scale,</text>
  <text x="409" y="224" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">solved with v_i and g</text>

  <!-- ===== Right panel: IMU preintegration ===== -->
  <rect x="490" y="70" width="300" height="240" rx="10" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="1.6"/>
  <text x="640" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#10b981">IMU preintegration</text>
  <text x="640" y="111" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.8">Δp, Δv between keyframes: metric, gravity mixed in</text>

  <g stroke="#10b981" stroke-width="2" fill="none">
    <line x1="520" y1="262" x2="575" y2="222" marker-end="url(#arrow-green)"/>
    <line x1="580" y1="219" x2="644" y2="202" marker-end="url(#arrow-green)"/>
    <line x1="652" y1="200" x2="716" y2="214" marker-end="url(#arrow-green)"/>
    <line x1="724" y1="216" x2="770" y2="260" marker-end="url(#arrow-green)"/>
  </g>
  <g fill="#10b981">
    <circle cx="520" cy="265" r="4"/>
    <circle cx="580" cy="219" r="4"/>
    <circle cx="652" cy="200" r="4"/>
    <circle cx="724" cy="216" r="4"/>
    <circle cx="776" cy="266" r="4"/>
  </g>
  <text x="540" y="232" text-anchor="end" font-size="11" fill="currentColor">Δt₀</text>
  <text x="612" y="198" text-anchor="middle" font-size="11" fill="currentColor">Δt₁</text>
  <text x="686" y="196" text-anchor="middle" font-size="11" fill="currentColor">Δt₂</text>
  <text x="758" y="228" font-size="11" fill="currentColor">Δt₃</text>

  <!-- gravity in the accelerometer -->
  <line x1="520" y1="132" x2="520" y2="176" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="530" y="152" font-size="11" fill="#ef4444">g (unknown direction,</text>
  <text x="530" y="166" font-size="11" fill="#ef4444">|g| = 9.81 m/s²)</text>
  <text x="640" y="296" text-anchor="middle" font-size="10.5" fill="currentColor" opacity="0.75">integrated accelerometer and gyro readings</text>

  <!-- ===== Alignment equations ===== -->
  <rect x="30" y="328" width="760" height="148" rx="10" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"/>
  <text x="50" y="351" font-size="12.5" font-weight="700" fill="currentColor">Linear alignment, for each consecutive keyframe pair (i, j):</text>
  <text x="70" y="375" font-size="13" fill="currentColor">s · (p_j − p_i) = v_i Δt − ½ g Δt² + R_i Δp</text>
  <text x="70" y="397" font-size="13" fill="currentColor">v_j − v_i = −g Δt + R_i Δv</text>
  <text x="440" y="375" font-size="11.5" fill="currentColor" opacity="0.85">left: vision (scaled) · right: IMU (metric)</text>
  <text x="440" y="397" font-size="11.5" fill="currentColor" opacity="0.85">unknowns: v₀ … v_n, g, s</text>
  <text x="50" y="424" font-size="11.5" fill="currentColor"><tspan font-weight="700">Solve:</tspan> least squares, first with g free (gives its direction), then with |g| held at 9.81 and g refined on its</text>
  <text x="50" y="440" font-size="11.5" fill="currentColor">2-D tangent, which pins the gauge. A non-positive s is rejected.</text>
  <text x="50" y="462" font-size="11.5" fill="currentColor"><tspan font-weight="700">Finish:</tspan> rotate the result so g points along −z (a gravity-aligned world; the vision yaw is kept).</text>

  <!-- ===== Observability gate ===== -->
  <rect x="30" y="490" width="760" height="56" rx="10" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="50" y="512" font-size="12.5" font-weight="700" fill="currentColor">Scale-observability gate</text>
  <text x="50" y="532" font-size="11.5" fill="currentColor">Decline the window if s · max‖p_i − p₀‖ &lt; 5 cm: under gentle motion s is unobservable and the solve collapses it toward 0.</text>
</svg>
